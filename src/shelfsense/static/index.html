<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShelfSense</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: 0; } .sub { color: #666; margin-top: .25rem; }
  input { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
  ul { list-style: none; padding: 0; }
  li { padding: .6rem .7rem; border-bottom: 1px solid #eee; }
  li.pick { cursor: pointer; } li.pick:hover { background: #f5f5ff; }
  .meta { color: #666; font-size: .85rem; }
  .chip { display: inline-block; background: #eef; border-radius: 4px; padding: 0 .4rem; font-size: .75rem; margin-right: .4rem; }
  #viewed { background: #fafafa; border-left: 4px solid #99f; padding: .5rem .8rem; margin: 1rem 0; }
</style>
</head>
<body>
<h1>ShelfSense</h1>
<p class="sub">Customers who viewed this also liked... Search for a makeup or skincare product, then pick it.</p>
<input id="q" placeholder="e.g. vitamin c serum, matte lipstick" autofocus>
<ul id="results"></ul>
<div id="viewed" hidden></div>
<ul id="recs"></ul>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const row = p => `<div>${esc(p.title)}</div><div class="meta"><span class="chip">${esc(p.category)}</span>${esc(p.store || "")}${p.price ? " · $" + p.price.toFixed(2) : ""}</div>`;
let timer;
$("q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = $("q").value.trim();
    if (q.length < 2) { $("results").innerHTML = ""; return; }
    const items = await (await fetch("/search?q=" + encodeURIComponent(q))).json();
    $("results").innerHTML = items.map(p => `<li class="pick" data-asin="${esc(p.asin)}">${row(p)}</li>`).join("");
    $("results").onclick = e => { const li = e.target.closest("li.pick"); if (li) recommend(li.dataset.asin, items.find(p => p.asin === li.dataset.asin)); };
  }, 250);
});
async function recommend(asin, product) {
  $("recs").innerHTML = "<li>Loading...</li>";
  const res = await fetch("/recommend?k=10&asin=" + encodeURIComponent(asin));
  if (!res.ok) { $("recs").innerHTML = "<li>Something went wrong.</li>"; return; }
  const data = await res.json();
  $("viewed").hidden = false;
  $("viewed").innerHTML = `<b>You viewed:</b> ${esc(product.title)}<div class="meta">Method: ${esc(data.source)}</div>`;
  $("results").innerHTML = "";
  $("recs").innerHTML = data.recommendations.map(p => `<li>${row(p)}</li>`).join("");
}
</script>
</body>
</html>
