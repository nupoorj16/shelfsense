[project]
name = "shelfsense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nupoorj16", email = "nupoorj16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
shelfsense = "shelfsense:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
train = [
    "sentence-transformers>=6.1.0",
]
